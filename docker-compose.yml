services:
    apache-dev:
        volumes:
            - ./node/dev:/var/www/html/js:rw
            - ./html:/var/www/html:rw
            - ./php.ini:/usr/local/etc/php/conf.d/php.ini:rw
        build:
            context: .
            dockerfile: services/apache/Dockerfile
        ports:
            - "8080:80"
        container_name: $PROJECTID-dev
    apache-prod:
        volumes:
            - ./node/prod:/var/www/html/js:rw
            - ./html:/var/www/html:rw
            - ./php.ini:/usr/local/etc/php/conf.d/php.ini:rw
        build:
            context: .
            dockerfile: services/apache/Dockerfile
        ports:
            - "8081:80"
        container_name: $PROJECTID-prod
    node-build:
        volumes:
            - ./node:/opt/project/app:rw
            - ./webpack/webpack.prod.config.js:/opt/project/webpack.config.js:rw
        build:
            context: .
            dockerfile: services/watch/Dockerfile
        # Defaults so a forgotten ./install.sh degrades to something workable
        # instead of resolving to a malformed "1000:" and failing oddly.
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        environment:
            # An unmatched host uid has no /etc/passwd entry, so HOME would be
            # "/" and npm/webpack cache writes fail with EACCES.
            - HOME=/tmp
    node-watch:
        volumes:
            - ./node:/opt/project/app:rw
            - ./webpack/webpack.dev.config.js:/opt/project/webpack.config.js:rw
        build:
            context: .
            dockerfile: services/watch/Dockerfile
        container_name: $PROJECTID-watch
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        environment:
            - HOME=/tmp
        ports:
            - "9229:9229"
